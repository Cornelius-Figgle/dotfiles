[ids]

*

[main]
# capslock to esc, or act as additional mod when held
capslock = overload(capslock, search)

[capslock:search]
# lefthand media controls
q = volumedown
w = playpause
e = volumeup
r = mute
a = prevsong
s = rewind
d = nextsong

# to avoid having to reach for fn
f1 = mute
f2 = volumedown
f3 = volumeup
