[general]
autosens = 0
sensitivity = 65

lower_cutoff_freq = 20
higher_cutoff_freq = 20000

sleep_timer = 60

[input]
{{#if (eq dotter.hostname "persephone")}}
	method = fifo
	source = /tmp/cava.fifo
	sample_rate = 44100
{{else}}
	{{#if (eq dotter.hostname "hades")}}
		method = pulse
	{{else}}
		method = pipewire
	{{/if}}
{{/if}}

[output]
channels = stereo

[smoothing]
monstercat = 0
waves = 0
